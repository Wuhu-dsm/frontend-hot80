<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>两栏布局</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h1>两栏布局</h1>
  <section class="layout flex">
    <aside>侧栏</aside>
    <main>主内容</main>
  </section>
  <section class="layout grid">
    <aside>侧栏</aside>
    <main>主内容</main>
  </section>
  <section class="layout float">
    <aside>侧栏</aside>
    <main>主内容</main>
  </section>
</body>
</html>
